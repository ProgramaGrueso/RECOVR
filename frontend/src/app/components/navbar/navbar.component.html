<header class="site-header" [class.scrolled]="isScrolled" id="main-header">
  <div class="header-left">
    <a routerLink="/" class="brand-mark" (click)="closeMobileMenu()" data-cursor="RECOVR">
      <span>RECOVR</span>
      <span class="brand-badge">SANCTUM</span>
    </a>
  </div>

  <div class="header-center">
    <div class="live-status">
      <span class="pulse-dot"></span>
      <span>SANCTUM OPEN &bull; ATENCIÓN PRIVADA</span>
    </div>
    <div class="live-clock">
      <span>LIMA, PE {{ limaTimeStr() }}</span>
    </div>
  </div>

  <div class="header-right">
    <a href="#masajes" class="btn-pill" data-cursor="TRATAMIENTOS">Tratamientos</a>
    <a href="#cabinas" class="btn-pill" data-cursor="CABINAS">Cabinas</a>
    <a href="#staff" class="btn-pill" data-cursor="MASAJISTAS">Masajistas</a>
    <a routerLink="/admin/login" class="btn-pill" data-cursor="MI CUENTA">Mi Cuenta</a>
    <button class="btn-pill primary" (click)="onReserve()" data-cursor="RESERVAR">
      <span>Reservar Cita (S/)</span>
    </button>
  </div>
</header>
