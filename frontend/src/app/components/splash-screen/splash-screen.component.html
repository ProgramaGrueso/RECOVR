@if (showSplash) {
  <div class="splash-screen-container" [class.fade-out]="isFadingOut">
    <video
      #splashVideo
      class="splash-video"
      src="videos/bubble-hero.mp4"
      autoplay
      [muted]="true"
      playsinline
      preload="auto"
      (ended)="onVideoEnded()">
    </video>
    <button class="splash-skip-btn" (click)="onVideoEnded()" type="button" aria-label="Saltar introducción">
      Saltar ✕
    </button>
    <div class="splash-bubble-loader">
      <span class="splash-brand">RECOVR</span>
    </div>
  </div>
}
