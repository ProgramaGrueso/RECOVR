<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 44 44"
  [style.width]="pixelSize"
  [style.height]="pixelSize"
  [style.color]="color"
  class="brand-mark-svg"
  aria-hidden="true">
  <defs>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF66A1" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <radialGradient id="bubbleGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#FF66A1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.1" />
    </radialGradient>
  </defs>

  <!-- Burbuja principal de cristal -->
  <circle cx="22" cy="22" r="17" fill="url(#bubbleGlow)" stroke="url(#bubbleGrad)" stroke-width="2" />
  
  <!-- Brillo de luz superior (efecto jelly/esfera) -->
  <ellipse cx="17" cy="15" rx="5" ry="3" transform="rotate(-30 17 15)" fill="#FFFFFF" opacity="0.75" />
  <circle cx="28" cy="28" r="1.5" fill="#FFFFFF" opacity="0.6" />

  <!-- Burbujitas flotantes alrededor -->
  <circle cx="9" cy="12" r="4.5" fill="none" stroke="#FF66A1" stroke-width="1.5" opacity="0.85" />
  <circle cx="8" cy="11" r="1.2" fill="#FFFFFF" opacity="0.8" />

  <circle cx="35" cy="14" r="3.2" fill="none" stroke="#38BDF8" stroke-width="1.3" opacity="0.85" />
  <circle cx="34" cy="13" r="0.9" fill="#FFFFFF" opacity="0.8" />

  <!-- Destello / Sparkle Star ✦ -->
  <path d="M22 13 L23 18 L28 19 L23 20 L22 25 L21 20 L16 19 L21 18 Z" fill="#FFFFFF" opacity="0.95" />
</svg>
