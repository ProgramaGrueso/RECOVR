<section class="catalog-page">
  <div class="catalog-header">
    <span class="subhead">CARTA DE MASAJES EXCLUSIVOS &bull; TARIFAS EN SOLES (S/)</span>
    <h1 class="title">MASAJES RECOVR</h1>
    <p class="desc">Toques sensitivos continuos, técnica nuru cuerpo a cuerpo y máxima relajación en cabinas privadas climatizadas.</p>
  </div>

  <div class="catalog-grid" *ngIf="isLoading">
    <app-service-card *ngFor="let item of [1,2,3,4,5,6]" [isLoading]="true"></app-service-card>
  </div>

  <div class="catalog-grid" *ngIf="!isLoading">
    <app-service-card
      *ngFor="let s of filteredServices"
      [service]="s"
      [isLoading]="false"
      (reserve)="onReserve($event)">
    </app-service-card>
  </div>

  <app-section-divider></app-section-divider>
</section>
