
services:
  recovr-mysql:
    image: mysql:8.0
    container_name: recovr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: recovr_db
    ports:
      - "3306:3306"
    volumes:
      - recovr_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  recovr_mysql_data:
