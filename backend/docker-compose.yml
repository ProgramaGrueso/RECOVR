# RECOVR — base de datos y (opcional) backend escalable detrás de un balanceador.
# Toda la configuración sale de backend/.env (copia .env.example y complétalo; .env no se sube a git).
#
#   Solo MySQL (desarrollo con mvn spring-boot:run):   docker compose up -d
#   Todo en contenedores, 2 réplicas del API:          docker compose --profile app up -d --build --scale api=2
#
services:
  mysql:
    image: mysql:8.0
    container_name: recovr-mysql
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en backend/.env}
      MYSQL_DATABASE: recovr_db
      # Usuario propio de la aplicación (no root), con permisos solo sobre recovr_db
      MYSQL_USER: ${DB_USERNAME:?Define DB_USERNAME en backend/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en backend/.env}
      TZ: America/Lima
    command: ["--max-connections=200"]
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - recovr_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Réplicas del API: atienden tráfico y no ejecutan el planificador (lo hace "planificador").
  api:
    profiles: ["app"]
    build: .
    image: recovr-backend:local
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment: &api-env
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/recovr_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en backend/.env (openssl rand -base64 48)}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LIFECYCLE_ENABLED: "false"

  # Una sola instancia con el planificador de estados (expiración de pendientes, no-show) y, si se pide, el seeder
  # demo: así nunca corren dos a la vez. No está detrás del balanceador.
  planificador:
    profiles: ["app"]
    image: recovr-backend:local
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *api-env
      LIFECYCLE_ENABLED: "true"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

  lb:
    profiles: ["app"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${API_PORT:-8095}:80"

volumes:
  recovr_mysql_data:
