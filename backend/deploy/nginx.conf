# Balanceador delante de las réplicas del backend (docker compose --profile app up --scale api=N).
# Docker resuelve "api" a la IP de cada réplica; nginx reparte en round-robin. Como el backend es stateless
# (JWT, sin sesión HTTP), cualquier réplica puede atender cualquier petición.
upstream recovr_api {
    server api:8095 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    client_max_body_size 5m;

    location / {
        proxy_pass http://recovr_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
        # Para comprobar el reparto entre réplicas
        add_header X-Upstream $upstream_addr always;
    }
}
