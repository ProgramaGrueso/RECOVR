# === Configuration for Unit & Integration Tests (H2 In-Memory Database) ===
spring.application.name=backend-test
# Perfil propio: no hereda la configuración de dev (MySQL)
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:recovr_testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT: sin clave fija en el repositorio; cada ejecución de pruebas genera una clave aleatoria en memoria
app.jwt.secret=
app.jwt.expiration-ms=3600000

# Las pruebas parten de una base vacia (el catalogo oficial se prueba en CatalogoInicialTest)
recovr.seed.catalogo=false
# Los estados se actualizan a mano en las pruebas (ReservaCicloVidaTest), sin planificador en segundo plano
recovr.lifecycle.enabled=false

# Sin caché en las pruebas: cada prueba revierte su transacción y una lista cacheada quedaría desactualizada
spring.cache.type=none

# CORS de las pruebas: lista blanca explícita (en producción sale de CORS_ALLOWED_ORIGINS)
recovr.cors.allowed-origins=http://localhost:4200,https://recovr-demo.vercel.app

# Límites por IP altos en las pruebas (todas usan 127.0.0.1); LimitesPorIpTest prueba los valores reales
recovr.seguridad.max-fallos-ip=10000
recovr.seguridad.max-registros-ip=10000
