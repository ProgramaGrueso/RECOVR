# === Configuracion de conexion a MySQL ===
# MySQL local (la base recovr_db se crea automáticamente si aún no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/recovr_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === Configuracion de JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# === Puerto del servidor (por defecto 8080) ===
server.port=8080
