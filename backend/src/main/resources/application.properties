spring.application.name=backend

# === Configuracion de conexion a MySQL ===
# MySQL local (la base recovr_db se crea automáticamente si aún no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/recovr_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === Configuracion de JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT: para produccion define JWT_SECRET como variable de entorno con una clave Base64 segura.
app.jwt.secret=${JWT_SECRET:cmVjb3ZyLWRlc2Fycm9sbG8tand0LXNlY3JldC1rZXktMzItYnl0ZXM=}
app.jwt.expiration-ms=86400000

# === Puerto del servidor (por defecto 8080) ===
server.port=8080
