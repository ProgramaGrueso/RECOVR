# =====================================================================================================================
# RECOVR — configuración común. Todo lo que cambia entre entornos sale de VARIABLES DE ENTORNO (ver .env.example).
# Perfiles: dev (por defecto, MySQL local), demo (dev + datos ficticios) y prod (sin valores por defecto inseguros).
# =====================================================================================================================
spring.application.name=recovr-backend
spring.profiles.default=dev
# "demo" = la configuración de dev (MySQL local) + los datos ficticios
spring.profiles.group.demo=dev
server.port=${SERVER_PORT:8095}

# === Base de datos ===
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/recovr_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones (HikariCP). Con N instancias el total es N x DB_POOL_MAX: debe quedar por debajo de
# max_connections de MySQL (151 por defecto).
spring.datasource.hikari.pool-name=recovr-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true
# Se deja activo a propósito: los DTO se arman en los controladores y algunas relaciones son LAZY. Las consultas de
# listados ya traen sus relaciones con @EntityGraph (sin N+1); desactivarlo queda como mejora (ver RESUMEN.md).
spring.jpa.open-in-view=true

# === Caché del catálogo (servicios, cabinas, terapeutas activas). Las reservas nunca se cachean. ===
spring.cache.type=${CACHE_TYPE:caffeine}
spring.cache.cache-names=servicios,salas,terapeutasActivas
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=${CACHE_TTL:60s}

# === Servidor HTTP ===
# IP real del cliente detrás del balanceador: Tomcat solo acepta X-Forwarded-For de proxies de red interna
# (10.x, 172.16-31.x, 192.168.x, 127.x), así que un cliente de Internet no puede falsificarla.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2048
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Los errores nunca incluyen trazas ni mensajes internos
server.error.include-stacktrace=never
server.error.include-message=never

# Salud para el balanceador y Docker (solo /actuator/health, sin detalles)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# === JWT === (JWT_SECRET: Base64 de 32 bytes o más. En prod es obligatoria; en dev, si falta, se genera una temporal)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# === CORS: orígenes del frontend que pueden llamar a la API (separados por coma; admite patrones explícitos como
# https://recovr-*.vercel.app). Por defecto, solo el servidor de desarrollo de Angular. ===
recovr.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# === Planificador de estados (expiración, no-show). Con varias instancias puede activarse en una sola. ===
recovr.lifecycle.enabled=${LIFECYCLE_ENABLED:true}

# === Mensajes de validacion en espanol ===
spring.web.locale=es
spring.web.locale-resolver=fixed

# === Springdoc / OpenAPI / Swagger UI ===
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# === Datos de demostracion: 90 dias de historial hasta hoy y citas agendadas hasta el 31 de diciembre. ===
# Se activan con el perfil "demo" (SPRING_PROFILES_ACTIVE=demo) o con SEED_DEMO_DATA=true.
recovr.seed.demo-data=${SEED_DEMO_DATA:false}
recovr.seed.dias-historial=${SEED_DIAS_HISTORIAL:90}
# Ultimo dia con citas futuras (vacio = 31 de diciembre del anio en curso)
recovr.seed.fin=${SEED_FIN:}
# Contraseña de las cuentas demo (admin.demo@example.com, ...). Sin ella no se crean cuentas demo.
recovr.seed.demo-password=${DEMO_PASSWORD:}

# === Primer administrador (solo si aún no existe ninguno) ===
recovr.bootstrap.admin-email=${ADMIN_EMAIL:}
recovr.bootstrap.admin-password=${ADMIN_PASSWORD:}
recovr.bootstrap.admin-nombre=${ADMIN_NOMBRE:Administrador}

# === Subida de fotos de perfil (JPG/PNG, máximo 3 MB; el servicio vuelve a validar y re-codifica) ===
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# === Asistente de IA (DeepSeek) ===
# La clave SOLO sale del entorno (DEEPSEEK_API_KEY); nunca va en el código ni en el repo. Sin clave, el chat responde 503.
recovr.ia.api-key=${DEEPSEEK_API_KEY:}
recovr.ia.base-url=https://api.deepseek.com
recovr.ia.modelo=deepseek-chat
# Límites para no gastar el saldo de la API
recovr.ia.max-por-minuto-ip=10
recovr.ia.max-por-dia-ip=100
recovr.ia.max-por-dia-global=1000
recovr.ia.max-caracteres-mensaje=500
recovr.ia.max-caracteres-respuesta=500
recovr.ia.registrar-conversaciones=${IA_REGISTRAR_CONVERSACIONES:false}

# === Datos del negocio que usa la asistente ===
recovr.negocio.direccion=Av. Primavera 1250, Santiago de Surco, Lima
recovr.negocio.whatsapp=+51 924 040 992

# === Rate limiting por IP (además de 5 fallos por correo+IP) ===
recovr.seguridad.max-fallos-ip=${LOGIN_MAX_FALLOS_IP:20}
recovr.seguridad.max-registros-ip=${REGISTRO_MAX_POR_IP:5}
