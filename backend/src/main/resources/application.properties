spring.application.name=backend

# === Configuracion de conexion a MySQL ===
# MySQL local (la base recovr_db se crea automáticamente si aún no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/recovr_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === Configuracion de JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT: define JWT_SECRET (Base64, minimo 32 bytes). Si falta, se genera una clave temporal al arrancar.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# === Mensajes de validacion en espanol ===
spring.web.locale=es
spring.web.locale-resolver=fixed

# === Puerto del servidor (8095 por defecto; SERVER_PORT lo cambia) ===
server.port=${SERVER_PORT:8095}

# === Springdoc / OpenAPI / Swagger UI ===
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Datos de demostracion (catalogo, personal, clientes y reservas de octubre a diciembre).
# Actívalo con SEED_DEMO_DATA=true: crea también las cuentas de demostración (ver backend/CREDENCIALES_DEMO.md).
recovr.seed.demo-data=${SEED_DEMO_DATA:false}
recovr.seed.inicio=2026-10-01
recovr.seed.fin=2026-12-31

# === Subida de fotos de perfil (JPG/PNG, máximo 3 MB; el servicio vuelve a validar y re-codifica) ===
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# === Asistente de IA (DeepSeek) ===
# La clave SOLO sale del entorno (DEEPSEEK_API_KEY); nunca va en el código ni en el repo. Sin clave, el chat responde 503.
recovr.ia.api-key=${DEEPSEEK_API_KEY:}
recovr.ia.base-url=https://api.deepseek.com
recovr.ia.modelo=deepseek-chat
# Límites para no gastar el saldo de la API
recovr.ia.max-por-minuto-ip=10
recovr.ia.max-por-dia-ip=100
recovr.ia.max-por-dia-global=1000
recovr.ia.max-caracteres-mensaje=500
recovr.ia.max-caracteres-respuesta=500
recovr.ia.registrar-conversaciones=${IA_REGISTRAR_CONVERSACIONES:false}

# === Datos del negocio que usa la asistente ===
recovr.negocio.direccion=Av. Primavera 1250, Santiago de Surco, Lima
recovr.negocio.whatsapp=+51 924 040 992
