# Perfil "prod": nada de valores por defecto inseguros. Faltan DB_URL, DB_USERNAME, DB_PASSWORD o JWT_SECRET -> no arranca.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
recovr.seguridad.exigir-jwt-secret=true
# Orígenes del frontend en producción (obligatorio)
recovr.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Sin SQL en el log
spring.jpa.show-sql=false

# Documentación interactiva apagada (se puede encender con SWAGGER_ENABLED=true)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
