# RECOVR completo con un solo comando:  docker compose up --build
# Abre http://localhost:4200  (cambia el puerto con WEB_PORT en .env)
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-recovr}
      MYSQL_DATABASE: recovr_db
    volumes:
      - recovr_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/recovr_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-recovr}
      JWT_SECRET: ${JWT_SECRET:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGENES_EXTRA: ${CORS_ORIGENES_EXTRA:-}
      # Asistente con IA de la web (opcional): sin clave responde que no está disponible.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-4200}:4200"

volumes:
  recovr_mysql_data:
