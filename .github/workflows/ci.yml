name: RECOVR CI Pipeline

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    name: Backend Build & Test (Java 21 / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify Maven and Java Environment
        run: |
          cd backend
          mvn -version

      - name: Compile Backend Project
        run: |
          cd backend
          mvn -B clean compile

      - name: Run Backend Automated Tests (JUnit 5 & Mockito)
        run: |
          cd backend
          mvn -B test

      - name: Build Production Package (JAR)
        run: |
          cd backend
          mvn -B package -DskipTests=false
